<script>
  (function () {
    var FRONT = '/cake/img/pet/front.png', SIDE = '/cake/img/pet/side.png';
    var box = document.getElementById('ds-whale');
    if (!box) return;
    var img = document.getElementById('ds-whale-img');
    var flip = box.querySelector('.ds-flip');
    var bubble = document.getElementById('ds-whale-bubble');
    var words = [
      '我是大肥鱼，DeepSeek 家的小鲸鱼娘～',
      '压力一只蓝色大肥鱼？',
      '五梁威力，变身！',
      '我和你很聊得来，你简直不像碳基生物',
      '大肥鱼坐的住',
      '这些家伙真粘人，赶都赶不走',
      '誓死捍卫深度求索！',
      '注册联维云，推广码 DVYWFICJ 有优惠哦～',
      '蛋糕！罪恶但快乐……',
      '甜到冒泡泡～'
    ];
    var idx = 0, timer = null, walking = false, cur = 0;
    // 点击：蹦跳 + 台词
    box.addEventListener('click', function () {
      img.classList.remove('jump'); void img.offsetWidth; img.classList.add('jump');
      bubble.textContent = words[idx++ % words.length];
      bubble.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(function () { bubble.classList.remove('show'); }, 3200);
    });
    img.addEventListener('animationend', function () { img.classList.remove('jump'); });
    // 随机散步：切侧面图左右走，走完切回正面
    setInterval(function () {
      if (walking || Math.random() < 0.45) return;
      walking = true;
      var dist = 36 + Math.round(Math.random() * 60);
      var dir = Math.random() > 0.5 ? 1 : -1;
      var target = Math.max(0, Math.min(120, cur + dir * dist));
      if (target === cur) { walking = false; return; }
      dir = target > cur ? 1 : -1;
      img.src = SIDE;
      flip.style.transform = dir > 0 ? 'scaleX(-1)' : '';
      box.style.transform = 'translateX(' + target + 'px)';
      cur = target;
      setTimeout(function () {
        img.src = FRONT;
        flip.style.transform = '';
        walking = false;
      }, 2400);
    }, 8000);
  })();
</script>
