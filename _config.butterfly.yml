# ---------- 注入：字体双源 + 禁选中/禁右键 + Live2D 看板娘 ----------
inject:
  head:
    - |
      <link rel="preconnect" href="https://fonts.loli.net">
    - |
      <link rel="stylesheet" href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap">
    - |
      <link rel="stylesheet" href="https://fonts.font.im/css2?family=ZCOOL+KuaiLe&display=swap">
    - |
      <style>
        *:not(input):not(textarea):not([contenteditable="true"]) {
          -webkit-user-select: none !important;
          -moz-user-select: none !important;
          -ms-user-select: none !important;
          user-select: none !important;
        }
      </style>
  bottom:
    - |
      <script defer src="https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
    - |
      <script>
        function isEditable(el) {
          var tag = el.tagName;
          return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
        }
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        document.addEventListener('selectstart', function (e) {
          if (!isEditable(e.target)) e.preventDefault();
        });
        // 拦截双击/三连击选词
        document.addEventListener('mousedown', function (e) {
          if (e.detail > 1 && !isEditable(e.target)) e.preventDefault();
        });
      </script>
    - |
      <script>
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (!window.L2Dwidget) return;
            try {
              L2Dwidget.init({
                model: {
                  jsonPath: 'https://cdn.jsdelivr.net/npm/live2d-widget-model-shizuku@1.0.5/assets/shizuku.model.json',
                  scale: 1
                },
                display: { position: 'left', width: 130, height: 260, hOffset: 20, vOffset: 0 },
                mobile: { show: true, scale: 0.5 },
                react: { opacityDefault: 0.85, opacityOnHover: 1 }
              });
            } catch (e) {}
          }, 1500);
        });
      </script>

