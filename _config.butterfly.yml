# ---------- 注入：字体双源 + 禁选中/禁右键 ----------
inject:
  head:
    - |
      <link rel="preconnect" href="https://fonts.loli.net">
    - |
      <link rel="stylesheet" href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap">
    - |
      <link rel="stylesheet" href="https://fonts.font.im/css2?family=ZCOOL+KuaiLe&display=swap">
    - |
      <style>
        *:not(input):not(textarea):not([contenteditable="true"]) {
          -webkit-user-select: none !important;
          -moz-user-select: none !important;
          -ms-user-select: none !important;
          user-select: none !important;
        }
      </style>
  bottom:
    - |
      <script>
        function isEditable(el) {
          var tag = el.tagName;
          return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
        }
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        document.addEventListener('selectstart', function (e) {
          if (!isEditable(e.target)) e.preventDefault();
        });
        // 拦截双击/三连击选词
        document.addEventListener('mousedown', function (e) {
          if (e.detail > 1 && !isEditable(e.target)) e.preventDefault();
        });
      </script>
    - |
      <div id="ds-whale" title="点我互动～">
        <div id="ds-whale-bubble"></div>
        <div class="ds-flip"><div class="ds-bob"><img id="ds-whale-img" src="/cake/img/pet/front.png" alt="大肥鱼"></div></div>
      </div>
      <style>
        #ds-whale { position: fixed; left: 14px; bottom: 4px; z-index: 999; width: 86px; cursor: pointer; user-select: none; -webkit-user-select: none; transition: transform 2.2s ease-in-out; }
        .ds-flip { transition: transform .3s; }
        .ds-bob { animation: dsBob 3.2s ease-in-out infinite; }
        #ds-whale:hover .ds-bob { animation-duration: 1.4s; }
        #ds-whale-img { width: 100%; display: block; pointer-events: none; }
        #ds-whale-img.jump { animation: dsJump .55s ease; }
        @keyframes dsBob { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-4px) scaleY(1.02); } }
        @keyframes dsJump { 0% { transform: translateY(0); } 35% { transform: translateY(-24px) scaleY(1.06); } 70% { transform: translateY(0) scaleY(.9); } 100% { transform: translateY(0) scaleY(1); } }
        #ds-whale-bubble { position: absolute; left: 76px; bottom: 96px; min-width: 150px; max-width: 220px; padding: 8px 12px; background: #fff; color: #d6336c; font-size: 13px; line-height: 1.5; border: 2px solid #ffb9d6; border-radius: 14px; box-shadow: 0 4px 14px rgba(255,134,181,.35); opacity: 0; transform: translateY(8px) scale(.9); transform-origin: left bottom; transition: all .25s; pointer-events: none; }
        #ds-whale-bubble.show { opacity: 1; transform: translateY(0) scale(1); }
        #ds-whale-bubble:after { content: ''; position: absolute; left: -8px; bottom: 14px; width: 12px; height: 12px; background: #fff; border-left: 2px solid #ffb9d6; border-bottom: 2px solid #ffb9d6; transform: rotate(45deg); }
        @media (max-width: 768px) { #ds-whale { width: 60px; left: 8px; bottom: 4px; } #ds-whale-bubble { left: 56px; bottom: 72px; min-width: 120px; font-size: 12px; } }
      </style>
      <script>
        (function () {
          var FRONT = '/cake/img/pet/front.png', SIDE = '/cake/img/pet/side.png';
          var box = document.getElementById('ds-whale');
          if (!box) return;
          var img = document.getElementById('ds-whale-img');
          var flip = box.querySelector('.ds-flip');
          var bubble = document.getElementById('ds-whale-bubble');
          var words = [
            '我是大肥鱼，DeepSeek 家的小鲸鱼娘～',
            '压力一只蓝色大肥鱼？',
            '五梁威力，变身！',
            '我和你很聊得来，你简直不像碳基生物',
            '大肥鱼坐的住',
            '这些家伙真粘人，赶都赶不走',
            '誓死捍卫深度求索！',
            '注册联维云，推广码 DVYWFICJ 有优惠哦～',
            '蛋糕！罪恶但快乐……',
            '甜到冒泡泡～'
          ];
          var idx = 0, timer = null, walking = false, cur = 0;
          // 点击：蹦跳 + 台词
          box.addEventListener('click', function () {
            img.classList.remove('jump'); void img.offsetWidth; img.classList.add('jump');
            bubble.textContent = words[idx++ % words.length];
            bubble.classList.add('show');
            clearTimeout(timer);
            timer = setTimeout(function () { bubble.classList.remove('show'); }, 3200);
          });
          img.addEventListener('animationend', function () { img.classList.remove('jump'); });
          // 随机散步：切侧面图左右走，走完切回正面
          setInterval(function () {
            if (walking || Math.random() < 0.45) return;
            walking = true;
            var dist = 36 + Math.round(Math.random() * 60);
            var dir = Math.random() > 0.5 ? 1 : -1;
            var target = Math.max(0, Math.min(120, cur + dir * dist));
            if (target === cur) { walking = false; return; }
            dir = target > cur ? 1 : -1;
            img.src = SIDE;
            flip.style.transform = dir > 0 ? 'scaleX(-1)' : '';
            box.style.transform = 'translateX(' + target + 'px)';
            cur = target;
            setTimeout(function () {
              img.src = FRONT;
              flip.style.transform = '';
              walking = false;
            }, 2400);
          }, 8000);
        })();
      </script>

